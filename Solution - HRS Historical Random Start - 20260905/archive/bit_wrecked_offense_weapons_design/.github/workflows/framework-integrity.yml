name: Framework Integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Parse PowerShell and check required framework files
        shell: pwsh
        run: ./tools/Test-FrameworkIntegrity.ps1
